<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>池塘水生植物觀察站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6EE; --paper-2:#E7ECDF; --ink:#1E2B25; --muted:#56665D; --line:#C9D3C3;
    --pond:#2F6B5E; --pond-deep:#123A34;
    --sub:#2B7FA3; --eme:#C9466F; --flo:#C98E12; --fre:#4F9A2C;
    --display:"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei","PingFang TC",serif;
    --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--pond-deep);color:var(--ink);font-family:var(--body);}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #FFD35A;outline-offset:2px}

  #app{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;inset:0;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  #veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;
    background:radial-gradient(ellipse at 50% 30%, rgba(120,200,190,0) 35%, rgba(6,40,38,.55) 100%)}
  #veil.on{opacity:1}
  #pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  .panel{background:rgba(244,246,238,.94);border:1px solid rgba(30,43,37,.12);border-radius:12px;box-shadow:0 6px 24px rgba(8,30,26,.25);backdrop-filter:blur(6px)}

  /* top */
  #top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;flex-wrap:wrap}
  #top > *{pointer-events:auto}
  #brand{padding:10px 16px 11px}
  #brand .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
  #brand h1{font-family:var(--display);font-weight:700;font-size:24px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
  #modebox{display:flex;align-items:center;gap:10px;padding:6px;flex-wrap:wrap;justify-content:flex-end}
  .seg{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:15px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--pond);color:#fff}
  #score{font-size:14px;font-weight:700;padding:0 10px 0 4px;font-variant-numeric:tabular-nums}

  /* legend */
  #legend{position:absolute;left:16px;top:calc(96px + env(safe-area-inset-top,0px));width:272px;max-height:calc(100% - 210px);overflow:auto}
  #legend summary{list-style:none;cursor:pointer;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
  #legend summary::-webkit-details-marker{display:none}
  #legend summary .chev{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
  #legend[open] summary .chev::after{content:"收合"}
  #legend:not([open]) summary .chev::after{content:"展開"}
  .types{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px}
  .type{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line)}
  .type svg{width:76px;height:56px;display:block;border-radius:6px}
  .type h3{margin:0;font-family:var(--display);font-size:17px;color:var(--c);display:flex;align-items:center;gap:6px}
  .type h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
  .type p{margin:2px 0 4px;font-size:13px;line-height:1.45;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{border:1px solid var(--c);color:var(--ink);background:#fff;border-radius:999px;padding:1px 9px;font-size:13px;cursor:pointer}
  .chip:hover{background:var(--c);color:#fff}
  .chips .locked{font-size:12px;color:var(--muted)}
  .tryit{margin:4px 10px 12px;padding:10px 12px;background:var(--paper-2);border-radius:8px;font-size:13px;line-height:1.55}
  .tryit b{font-family:var(--display);font-size:15px}

  /* bottom bar */
  #bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;padding:8px 12px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px)}
  #lvlwrap{display:flex;align-items:center;gap:8px;font-size:14px}
  #lvlwrap label{font-weight:700;white-space:nowrap}
  #lvl{width:150px;accent-color:var(--pond)}
  #lvlout{min-width:72px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
  .btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:rgba(18,58,52,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
  #hint.gone{opacity:0}

  /* pins */
  .pin{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;will-change:transform}
  .pin .tag{background:var(--paper);border:2px solid var(--c);border-radius:999px;padding:3px 11px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .15s}
  .pin:hover .tag,.pin:focus-visible .tag{transform:scale(1.08)}
  .pin .tag small{font-weight:500;color:var(--c);margin-left:4px;font-size:12px}
  .pin .stick{width:2px;height:16px;background:rgba(255,255,255,.9)}
  .pin .dot{width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid #fff;position:relative}
  .pin .dot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:ring 2.2s ease-out infinite}
  .pin.active .tag{background:var(--c);color:#fff}
  .pin.active .tag small{color:#fff}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.8);opacity:0}}

  /* card */
  #card{position:absolute;right:16px;top:calc(96px + env(safe-area-inset-top,0px));width:360px;max-height:calc(100% - 200px);overflow:auto;padding:0}
  #card .head{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
  #card .kind{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
  #card h2{font-family:var(--display);font-size:28px;margin:6px 0 0;line-height:1.2}
  #card .close{position:absolute;right:10px;top:10px;border:0;background:var(--paper-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
  #card .body{padding:12px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .where{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .where dt{padding:8px 10px;background:var(--paper-2);font-family:var(--display);font-weight:700;font-size:16px;border-top:1px solid var(--line)}
  .where dd{margin:0;padding:8px 12px;font-size:14px;line-height:1.5;border-top:1px solid var(--line)}
  .where dt:first-of-type,.where dd:first-of-type{border-top:0}
  #card h4{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.05em}
  #card ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.6}
  .task{background:#FFF6D8;border:1px dashed #D9B44A;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55}
  .task b{font-family:var(--display)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions .btn.primary{background:var(--pond);color:#fff;border-color:var(--pond)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{border:2px solid var(--c);background:#fff;border-radius:10px;padding:10px 8px;cursor:pointer;font-family:var(--display);font-size:18px;font-weight:700;color:var(--ink)}
  .opt:hover{background:var(--c);color:#fff}
  .opt[disabled]{opacity:.35;cursor:not-allowed;background:#fff;color:var(--ink)}
  .fb{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55}
  .fb.no{background:#FDECEC;border:1px solid #E7A5A5}
  .fb.yes{background:#E6F4DD;border:1px solid #9CCB83}
  .q{font-size:15px;line-height:1.55;margin:0}
  table.recap{width:100%;border-collapse:collapse;font-size:14px}
  table.recap td{padding:5px 4px;border-top:1px solid var(--line)}
  table.recap td:last-child{text-align:right;font-weight:700}

  @media (max-width: 760px){
    #brand h1{font-size:19px}
    #brand{padding:8px 12px}
    #legend{top:calc(128px + env(safe-area-inset-top,0px));width:auto;right:16px;max-height:52%}
    #bar{gap:8px}
    #hint{display:none}
    #card{left:16px;right:16px;width:auto;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:62%;z-index:5}
    #lvl{width:110px}
  }
  @media (prefers-reduced-motion: reduce){ .pin .dot::after{animation:none} }
</style>
</head>
<body>

<div id="app">
  <div id="stage" aria-label="360 度池塘場景，拖曳可以環顧四周"></div>
  <div id="veil"></div>
  <div id="pins"></div>

  <div id="top">
    <div id="brand" class="panel">
      <div class="eyebrow">四上自然 ・ 單元二 水生生物與環境</div>
      <h1>池塘水生植物觀察站</h1>
    </div>
    <div id="modebox" class="panel">
      <span id="score" hidden></span>
      <div class="seg" role="group" aria-label="模式">
        <button id="mExplore" aria-pressed="true">探索</button>
        <button id="mChallenge" aria-pressed="false">分類挑戰</button>
      </div>
    </div>
  </div>

  <details id="legend" class="panel" open>
    <summary>四類水生植物 <span class="chev"></span></summary>
    <div class="types" id="types"></div>
    <div class="tryit"><b>動手試試看</b><br>拖動下方「水位」，觀察：水變深或變淺時，<b>睡蓮的葉子</b>還貼在水面嗎？<b>水蘊草</b>的莖又會怎樣？</div>
  </details>

  <aside id="card" class="panel" hidden aria-live="polite"></aside>

  <div id="hint">拖曳畫面環顧四周・滾輪或雙指縮放・點選圖釘認識植物</div>

  <div id="bar" class="panel">
    <div class="seg" role="group" aria-label="視角">
      <button id="vAbove" aria-pressed="true">水面上</button>
      <button id="vBelow" aria-pressed="false">潛入水下</button>
    </div>
    <div id="lvlwrap">
      <label for="lvl">水位</label>
      <input type="range" id="lvl" min="-100" max="80" step="5" value="0">
      <output id="lvlout" for="lvl">平常</output>
    </div>
    <button class="btn" id="spin" aria-pressed="false">自動環顧</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const V3 = THREE.Vector3;

/* ---------------- 教學資料 ---------------- */
const TYPES = {
  sub:{name:'沉水性', color:'#2B7FA3', line:'整株沉在水面下，根長在水底泥土裡。',
       root:'長在水底的泥土裡', body:'莖和葉整株沉在水面下'},
  eme:{name:'挺水性', color:'#C9466F', line:'根長在水底泥土裡，葉和花挺出水面。',
       root:'長在水底的泥土裡', body:'葉和花挺出水面'},
  flo:{name:'浮葉性', color:'#C98E12', line:'根長在水底泥土裡，葉平貼在水面。',
       root:'長在水底的泥土裡', body:'葉平貼在水面，花挺出水面'},
  fre:{name:'漂浮性', color:'#4F9A2C', line:'根沒有固定在泥土裡，整株浮在水面。',
       root:'垂在水中，沒有固定在泥土裡', body:'整株浮在水面，會隨水漂動'}
};
const TYPE_ORDER = ['sub','eme','flo','fre'];

const PLANTS = [
  {id:'hydrilla', name:'水蘊草', type:'sub',
    root:'長在水底的泥土裡', leaf:'3～8 片葉輪生在莖上，細長像線，整株沉在水面下', flower:'繁殖期花柄會挺出水面',
    feat:['莖和葉很柔軟，會隨水流擺動','水位改變時，莖會伸展或彎曲，適應水域環境'],
    task:'把「水位」往左調低，看看水蘊草的莖會怎樣？', act:'below'},
  {id:'eelgrass', name:'苦草', type:'sub',
    root:'長在水底的泥土裡', leaf:'葉片細長像緞帶，從水底一叢叢長出來', flower:'不明顯',
    feat:['葉片柔軟，隨水流飄動','和水蘊草一樣，整株生活在水中'],
    task:'潛入水下，比較苦草和水蘊草的葉子形狀有什麼不同。', act:'below'},
  {id:'lily', name:'睡蓮', type:'flo',
    root:'根和地下塊莖長在水底的泥土裡', leaf:'圓形、有一道缺口，平貼在水面', flower:'花挺出水面',
    feat:['葉柄長又柔軟，會隨水位伸展或彎曲，讓葉面一直平貼水面，爭取陽光','天氣較冷的冬季會落葉休眠'],
    task:'拖動「水位」，睡蓮的葉子會沉下去嗎？潛入水下看看它的葉柄。', act:'level'},
  {id:'nuphar', name:'臺灣萍蓬草', type:'flo',
    root:'根和地下莖長在水底的泥土裡', leaf:'長橢圓形，浮貼在水面', flower:'黃色的「花瓣」其實是 4～6 枚萼片，挺出水面',
    feat:['臺灣特有種','真正的花瓣已經退化了'],
    task:'萍蓬草和睡蓮有哪裡相同？哪裡不一樣？', act:'below'},
  {id:'lotus', name:'荷花', type:'eme',
    root:'根和地下莖（蓮藕）長在水底的泥土裡', leaf:'又大又圓，挺出水面', flower:'粉紅或白色，挺出水面；種子就是蓮子',
    feat:['葉面不容易沾水，水滴會滾成水珠','葉柄和蓮藕有許多中空的孔洞，可以儲存空氣','剛長出的葉子浮在水面，長大後才挺出水面'],
    task:'潛入水下，找找看泥土上的蓮藕在哪裡？', act:'below'},
  {id:'cattail', name:'香蒲', type:'eme',
    root:'地下莖長在水底的泥土裡', leaf:'細長像線，挺出水面', flower:'紅褐色、圓筒形的花穗，像一根蠟燭，所以又叫「水蠟燭」',
    feat:['葉子又長又直，高高挺出水面'],
    task:'找找看像熱狗一樣的咖啡色花穗。', act:'above'},
  {id:'hyacinth', name:'布袋蓮', type:'fre',
    root:'鬚根垂在水中，沒有固定在泥土裡', leaf:'卵形或接近圓形，葉柄膨大像一個囊袋', flower:'淡紫色，花瓣 3 片',
    feat:['葉柄裡有許多孔洞可以儲存空氣，擠壓會冒出氣泡，幫助它浮在水面','繁殖力超強，若不管理會蓋滿整個水面，造成水質優養化'],
    task:'潛入水下，看看布袋蓮的根有碰到泥土嗎？', act:'below'},
  {id:'lettuce', name:'大萍', type:'fre',
    root:'細細的根垂在水中，沒有固定在泥土裡', leaf:'葉片一簇簇長在一起，像一朵花；葉面有細毛', flower:'很小，不容易看到',
    feat:['葉面的細毛能幫助它浮在水面','有走莖，每條走莖都能長出一株小苗'],
    task:'找找看，大萍和大萍之間連著的細莖（走莖）。', act:'above'},
  {id:'duckweed', name:'浮萍', type:'fre',
    root:'每片背面垂著 1 條絲狀的根，漂在水中', leaf:'卵形或橢圓形的小葉狀體，2～4 片連在一起', flower:'很少看到',
    feat:['植物體非常小，常常一大片鋪滿水面','會隨著風和水流漂動'],
    task:'浮萍雖然小小一片，也是一株完整的植物喔！潛入水下看看它的根。', act:'below'}
];
const byId = Object.fromEntries(PLANTS.map(p=>[p.id,p]));

/* ---------------- 工具 ---------------- */
let seed = 20260922;
function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const R = (a,b)=>a+(b-a)*rnd();
const MUD = -2.6, SHORE = 1.2;
function bottomY(x,z){ const r=Math.hypot(x,z); return r>=30 ? SHORE : MUD + Math.pow(r/30,3)*(SHORE-MUD); }
function polar(deg,d){ const a=deg*Math.PI/180; return new V3(Math.sin(a)*d,0,-Math.cos(a)*d); }
function mat(color,o){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:0},o||{})); }
const DS = THREE.DoubleSide;

const W = { level:0, under:false };

/* ---------------- 場景 ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKYFOG = new THREE.Color(0xdcebe2), UNDERFOG = new THREE.Color(0x1f5a52);
scene.fog = new THREE.Fog(SKYFOG.clone(), 45, 260);
renderer.setClearColor(SKYFOG);

const camera = new THREE.PerspectiveCamera(70, stage.clientWidth/stage.clientHeight, 0.05, 700);
const EYE_ABOVE = 2.45, CAM_X = 0, CAM_Z = 0.9;
camera.position.set(CAM_X, EYE_ABOVE, CAM_Z);

scene.add(new THREE.HemisphereLight(0xd6ecff, 0x4b5a3a, 0.95));
const sun = new THREE.DirectionalLight(0xfff3dc, 0.85); sun.position.set(30,50,-20); scene.add(sun);

// 天空
const sky = new THREE.Mesh(new THREE.SphereGeometry(500,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{top:{value:new THREE.Color(0x6fa9d6)}, mid:{value:new THREE.Color(0xbfdbe8)}, bot:{value:new THREE.Color(0xdcebe2)}},
  vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h=normalize(vP).y; vec3 c = h>0.0 ? mix(mid, top, smoothstep(0.0,0.6,h)) : bot; c = mix(bot, c, smoothstep(-0.02,0.08,h)); gl_FragColor=vec4(c,1.0);}'
}));
scene.add(sky);
// 雲
const cloudMat = new THREE.MeshBasicMaterial({color:0xffffff, fog:false, transparent:true, opacity:.92});
for(let i=0;i<9;i++){
  const g=new THREE.Group(), a=R(0,Math.PI*2), d=R(300,380);
  g.position.set(Math.sin(a)*d, R(90,150), Math.cos(a)*d);
  for(let k=0;k<5;k++){ const s=new THREE.Mesh(new THREE.SphereGeometry(R(14,24),10,8), cloudMat); s.position.set(R(-30,30),R(-4,6),R(-10,10)); s.scale.y=.55; g.add(s); }
  g.lookAt(0,g.position.y,0); scene.add(g);
}
// 遠山
const hillMat = new THREE.MeshLambertMaterial({color:0x5d7f5a});
for(let i=0;i<16;i++){
  const a=i/16*Math.PI*2+R(0,.3), d=R(170,230), r=R(40,70);
  const h=new THREE.Mesh(new THREE.SphereGeometry(r,16,10), hillMat);
  h.position.set(Math.sin(a)*d, -r*0.55, Math.cos(a)*d); h.scale.y=R(.5,.8); scene.add(h);

function addPetiole(root, top, lift, matl, radius){
  const p={R:root, x:top.x, z:top.z, lift, L:(0-root.y)*1.3+lift+.25, r:radius||.016,
    dir:new V3(R(-1,1),0,R(-1,1)).normalize(), mesh:new THREE.Mesh(new THREE.BufferGeometry(), matl)};
  scene.add(p.mesh); petioles.push(p); return p;
}
function updatePetiole(p){
  const T=new V3(p.x, W.level+p.lift, p.z);
  const dist=p.R.distanceTo(T), slack=Math.max(0,p.L-dist);
  const mid=p.R.clone().lerp(T,.5).addScaledVector(p.dir, slack*.55+.04);
  const pts=[p.R.clone(), p.R.clone().add(new V3(0,.18,0)), mid, T.clone().add(new V3(0,-.14,0)), T];
  p.mesh.geometry.dispose();
  p.mesh.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 22, p.r, 5, false);
}

    if(i%3===0){ roots.push(x,0,z, x+R(-.01,.01),-R(.1,.18),z+R(-.01,.01)); } }
  G.add(im);
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(roots,3));
  G.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xd9ecd0})));

// 水蘊草
function buildHydrilla(){
  const c=polar(-142,3.9); const stemM=mat(0x4d8a3a), leafM=mat(0x3f8f3a,{side:DS,roughness:.7});
  const leafGeo=new THREE.PlaneGeometry(.022,.11); leafGeo.translate(0,.055,0);
  for(let i=0;i<16;i++){
    const a=R(0,6.28), d=Math.sqrt(rnd())*1.05, x=c.x+Math.cos(a)*d, z=c.z+Math.sin(a)*d, by=bottomY(x,z), H=R(1.5,2.1);
    const outer=new THREE.Group(); outer.position.set(x,by,z); outer.rotation.y=R(0,6.28); scene.add(outer);
    const piv=new THREE.Group(); outer.add(piv);
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.01,.013,H,4),stemM); s.position.y=H/2; piv.add(s);
    const nodes=Math.floor(H/.075), per=5, im=new THREE.InstancedMesh(leafGeo,leafM,nodes*per), dm=new THREE.Object3D();
    let k=0; for(let nd=0;nd<nodes;nd++){ const y=.1+nd*.075; const sc=nd>nodes-5?.6+(nodes-nd)*.08:1;
      for(let j=0;j<per;j++){ dm.position.set(0,y,0); dm.rotation.set(0,j/per*6.28+nd*.6,0); dm.rotateZ(-1.0); dm.scale.setScalar(sc); dm.updateMatrix(); im.setMatrixAt(k++,dm.matrix);} }
    piv.add(im);
    swayers.push({piv, H, by, ph:R(0,6.28), amp:R(.04,.09)});

}
// 苦草
function buildEelgrass(){

  for(let i=0;i<34;i++){
    const a=R(0,6.28), d=Math.sqrt(rnd())*1.0, x=c.x+Math.cos(a)*d, z=c.z+Math.sin(a)*d, by=bottomY(x,z), L=R(1.4,2.1);
    const g=new THREE.PlaneGeometry(.055,L,1,12); g.translate(0,L/2,0);

const pointers=new Map(); let lastPinch=0, dragged=false;

  const p=pointers.get(e.pointerId); if(!p) return;
  if(pointers.size===2){
    p.x=e.clientX; p.y=e.clientY; const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);

const clock=new THREE.Clock(); let wasUnder=null;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function ease(t){ return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function frame(){
  const raw=clock.getDelta(), dt=Math.min(raw,.05), t=clock.elapsedTime;
  // 視角
  if(fly){ const k=Math.min(1,(performance.now()-fly.s)/fly.dur), e=ease(k); lon=fly.l0+(fly.l1-fly.l0)*e; lat=fly.t0+(fly.t1-fly.t0)*e; if(k>=1) fly=null; }
  else if(!pointers.size){ lon+=vLon; lat+=vLat; vLon*=.9; vLat*=.9; clampLat(); if(spin) lon+=dt*4; }
  camY += (camTarget-camY)*(1-Math.exp(-Math.min(raw,.5)*2.6)); if(Math.abs(camTarget-camY)<.002) camY=camTarget;
  camera.position.set(CAM_X,camY,CAM_Z);
  const la=lat*Math.PI/180, lo=lon*Math.PI/180;
  camera.lookAt(CAM_X+Math.sin(lo)*Math.cos(la), camY+Math.sin(la), CAM_Z-Math.cos(lo)*Math.cos(la));

  // 水上／水下
  const under = camY < W.level;
  if(under!==wasUnder){
    wasUnder=under;
    if(under){ scene.fog.color.copy(UNDERFOG); scene.fog.near=1; scene.fog.far=19; renderer.setClearColor(UNDERFOG); sky.visible=false;
      waterMat.color.set(0x9ad8cf); waterMat.opacity=.78; motes.visible=true; }
    else { scene.fog.color.copy(SKYFOG); scene.fog.near=45; scene.fog.far=260; renderer.setClearColor(SKYFOG); sky.visible=true;
      waterMat.color.set(0x3f7f76); waterMat.opacity=.6; motes.visible=false; }
    document.getElementById('veil').classList.toggle('on',under);
  }

  if(!reduce){
    waterTex.offset.set(t*.004, t*.0025);
    swayers.forEach(s=>{ const avail=W.level-.22-s.by; const bend=s.H>avail? Math.acos(Math.max(.12,Math.min(1,avail/s.H))) : 0;
      s.piv.rotation.z = bend + Math.sin(t*.8+s.ph)*s.amp; });
    ribbons.forEach(r=>{ const a=r.g.attributes.position, b=r.base;
      for(let i=0;i<a.count;i++){ const y=b[i*3+1], k=y/r.L; a.array[i*3+2]=b[i*3+2]+Math.sin(t*1.1+r.ph+y*1.6)*.16*k*k; }
      a.needsUpdate=true; });
    floaters.forEach(f=>{ const amp=f.amp||.12; f.g.position.x=f.base.x+Math.sin(t*.25+f.ph)*amp; f.g.position.z=f.base.z+Math.cos(t*.2+f.ph)*amp; f.g.rotation.y=Math.sin(t*.1+f.ph)*.08; });
    fishes.forEach(F=>{ const a=F.ph+t*F.sp; const y=Math.min(F.y+W.level, W.level-.3);
      F.f.position.set(Math.cos(a)*F.r, y+Math.sin(t*1.3+F.ph)*.05, Math.sin(a)*F.r-2);
      F.f.rotation.y = -a + (F.sp>0? Math.PI : 0); });
  } else {
    swayers.forEach(s=>{ const avail=W.level-.22-s.by; s.piv.rotation.z = s.H>avail? Math.acos(Math.max(.12,Math.min(1,avail/s.H))) : 0; });
  }

  renderer.render(scene,camera);
  updatePins();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
